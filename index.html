<!doctype html>

<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Galaxia de Sofía 🌻</title><style>
html,body{
    margin:0;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

/* =========================
   MENSAJES
========================= */

.message{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:50;
    pointer-events:none;
    text-align:center;
    width:90%;
}

.message h1{
    margin:0;
    color:#ffd900;
    font-size:clamp(35px,8vw,78px);
    line-height:1;
    text-shadow:
        0 0 5px #fff,
        0 0 15px #ffd900,
        0 0 35px #ff9900,
        0 0 70px #ff5500;
    animation:pulse 2.5s infinite;
}

.message p{
    color:#fff3a0;
    font-size:clamp(15px,3vw,24px);
    text-shadow:0 0 12px #ffae00;
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.06)}
}

/* =========================
   BOTÓN
========================= */

.surprise{
    position:fixed;
    top:18px;
    right:18px;
    z-index:100;

    border:2px solid #ffd400;
    border-radius:30px;

    padding:10px 15px;

    background:rgba(0,0,0,.5);
    color:#ffd900;

    font-weight:bold;
    cursor:pointer;

    box-shadow:
        0 0 10px #ffd000,
        0 0 25px #ff9900;
}

/* =========================
   REPRODUCTOR
========================= */

.player{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);

    width:90%;
    max-width:620px;

    display:flex;
    align-items:center;
    gap:10px;

    padding:10px 14px;

    border:2px solid #ffd000;
    border-radius:999px;

    background:rgba(10,7,0,.65);
    backdrop-filter:blur(8px);

    box-shadow:
        0 0 15px #ffd000,
        0 0 35px #ff8500;

    z-index:100;
    color:#fff;
}

.player button{
    border:none;
    background:none;
    color:#ffd700;
    font-size:23px;
    cursor:pointer;
}

.progress{
    flex:1;
    height:13px;
    background:rgba(255,255,255,.12);
    border-radius:20px;
    overflow:hidden;
    cursor:pointer;
}

.progress-bar{
    width:0%;
    height:100%;
    background:
        linear-gradient(
            90deg,
            #fff700,
            #ffd000,
            #ff8800,
            #fff700
        );

    background-size:300% 100%;
    animation:flow 4s linear infinite;
}

@keyframes flow{
    from{background-position:0%}
    to{background-position:300%}
}

.time{
    min-width:75px;
    text-align:right;
    font-size:12px;
}

/* =========================
   PÉTALOS
========================= */

.petal{
    position:fixed;
    z-index:40;
    pointer-events:none;

    font-size:22px;

    animation:fall linear forwards;

    filter:
        drop-shadow(0 0 5px #ffd000);
}

@keyframes fall{

    0%{
        transform:
            translateY(-10vh)
            rotate(0);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:
            translateY(110vh)
            translateX(var(--drift))
            rotate(720deg);
        opacity:0;
    }
}

/* =========================
   IMÁGENES DE PERROS
========================= */

.dog{
    position:fixed;
    z-index:35;

    width:110px;
    max-width:22vw;

    pointer-events:none;

    filter:
        drop-shadow(0 0 8px #ffd000);

    animation:dogFloat 4s ease-in-out infinite;
}

.dog1{
    left:4%;
    top:25%;
}

.dog2{
    right:4%;
    bottom:30%;
    animation-delay:1.5s;
}

@keyframes dogFloat{

    0%,100%{
        transform:translateY(0) rotate(-3deg);
    }

    50%{
        transform:translateY(-18px) rotate(3deg);
    }
}

@media(max-width:600px){

    .message h1{
        font-size:44px;
    }

    .message p{
        font-size:15px;
    }

    .dog{
        width:75px;
    }

    .player{
        width:95%;
        bottom:8px;
    }
}
</style></head><body><canvas id="c"></canvas>

<!-- =========================
     MENSAJE CENTRAL
========================= --><div class="message"><h1>
    SOFÍA 🌻
</h1>

<p>
    Para mi prima la gorda 🖕🖕🖕🖕<br>
    con mucho cariño 😂💛
</p>

</div><!-- =========================
     PERROS
     
     Coloca tus imágenes como:
     perro1.png
     perro2.png
     
     en la misma carpeta.
========================= --><img
class="dog dog1"
src="perro1.png"
alt="Perro meme">

<img
class="dog dog2"
src="perro2.png"
alt="Perro meme">

<button class="surprise" id="surprise">
    🌻 Sorpresa
</button><!-- =========================
     REPRODUCTOR
========================= --><div class="player"><button id="play">
    ▶️
</button>

<div
    class="progress"
    id="progress">

    <div
        class="progress-bar"
        id="progressBar">
    </div>

</div>

<div
    class="time"
    id="time">

    0:00 / 0:00

</div>

</div><!--
    Pon una canción alegre/no romántica
    con el nombre:

    musica.mp3

    en la misma carpeta.
--><audio id="audio" loop><source
    src="musica.mp3"
    type="audio/mpeg">

</audio><script src="https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js"></script><script>

/* =====================================================
   ESCENA
===================================================== */

const canvas=
    document.getElementById("c");

const renderer=
    new THREE.WebGLRenderer({
        canvas:canvas,
        antialias:true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);

renderer.setSize(
    innerWidth,
    innerHeight
);

const scene=
    new THREE.Scene();

const camera=
    new THREE.PerspectiveCamera(
        60,
        innerWidth/innerHeight,
        .1,
        5000
    );


/* =====================================================
   ESTRELLAS
===================================================== */

function createStars(){

    const count=5000;

    const geometry=
        new THREE.BufferGeometry();

    const positions=
        new Float32Array(
            count*3
        );

    for(let i=0;i<count;i++){

        const radius=
            500+
            Math.random()*2500;

        const theta=
            Math.random()*Math.PI*2;

        const phi=
            Math.acos(
                2*Math.random()-1
            );

        positions[i*3]=
            radius*
            Math.sin(phi)*
            Math.cos(theta);

        positions[i*3+1]=
            radius*
            Math.cos(phi);

        positions[i*3+2]=
            radius*
            Math.sin(phi)*
            Math.sin(theta);
    }

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );

    const material=
        new THREE.PointsMaterial({
            color:0xffffff,
            size:1.6,
            depthWrite:false
        });

    scene.add(
        new THREE.Points(
            geometry,
            material
        )
    );
}

createStars();


/* =====================================================
   GALAXIA
===================================================== */

function createGalaxy(){

    const count=7000;

    const geometry=
        new THREE.BufferGeometry();

    const positions=
        new Float32Array(
            count*3
        );

    const colors=
        new Float32Array(
            count*3
        );

    const color=
        new THREE.Color();

    for(let i=0;i<count;i++){

        const arm=
            i%6;

        const radius=
            Math.pow(
                Math.random(),
                .65
            )*750;

        const angle=
            radius*.016+
            arm*(Math.PI*2/6)+
            (Math.random()-.5)*.45;

        const spread=
            (Math.random()-.5)*
            (25+radius*.06);

        positions[i*3]=
            Math.cos(angle)*
            radius+
            spread;

        positions[i*3+1]=
            (Math.random()-.5)*
            (20+radius*.03);

        positions[i*3+2]=
            Math.sin(angle)*
            radius+
            spread;

        const r=
            Math.random();

        if(r<.5)
            color.set("#ffd83d");
        else if(r<.8)
            color.set("#fff0a0");
        else
            color.set("#ff9b00");

        colors[i*3]=color.r;
        colors[i*3+1]=color.g;
        colors[i*3+2]=color.b;
    }

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );

    geometry.setAttribute(
        "color",
        new THREE.BufferAttribute(
            colors,
            3
        )
    );

    const material=
        new THREE.PointsMaterial({
            size:2.3,
            vertexColors:true,
            transparent:true,
            opacity:.9,
            depthWrite:false
        });

    const galaxy=
        new THREE.Points(
            geometry,
            material
        );

    scene.add(galaxy);

    return galaxy;
}

const galaxy=
    createGalaxy();


/* =====================================================
   NÚCLEO
===================================================== */

const core=
    new THREE.Mesh(

        new THREE.SphereGeometry(
            45,
            64,
            64
        ),

        new THREE.MeshBasicMaterial({
            color:0xffb300,
            transparent:true,
            opacity:.65
        })
    );

scene.add(core);


/* =====================================================
   GIRASOL CENTRAL
===================================================== */

function createSunflower(){

    const group=
        new THREE.Group();

    const yellow=
        new THREE.MeshBasicMaterial({
            color:0xffdd00,
            side:THREE.DoubleSide
        });

    for(let i=0;i<20;i++){

        const petal=
            new THREE.Mesh(
                new THREE.CircleGeometry(
                    14,
                    24
                ),
                yellow
            );

        const angle=
            i*Math.PI*2/20;

        petal.position.set(
            Math.cos(angle)*24,
            Math.sin(angle)*24,
            0
        );

        petal.rotation.z=
            angle;

        group.add(petal);
    }

    const center=
        new THREE.Mesh(
            new THREE.CircleGeometry(
                24,
                32
            ),
            new THREE.MeshBasicMaterial({
                color:0x542500
            })
        );

    center.position.z=.5;

    group.add(center);

    group.scale.set(
        1.5,
        1.5,
        1.5
    );

    return group;
}

const sunflower=
    createSunflower();

scene.add(sunflower);


/* =====================================================
   ANILLOS
===================================================== */

function ring(radius,color,opacity){

    return new THREE.Mesh(

        new THREE.RingGeometry(
            radius,
            radius+5,
            128
        ),

        new THREE.MeshBasicMaterial({
            color,
            transparent:true,
            opacity,
            side:THREE.DoubleSide
        })
    );
}

const ring1=
    ring(80,0xffd000,.8);

const ring2=
    ring(110,0xffa000,.6);

const ring3=
    ring(145,0xffe66b,.4);

ring1.rotation.x=
ring2.rotation.x=
ring3.rotation.x=
Math.PI/2;

scene.add(
    ring1,
    ring2,
    ring3
);


/* =====================================================
   MENSAJES ORBITALES
===================================================== */

const WORDS=[

    "🌻 Sofía",
    "💛 Mi prima",
    "😂 La gorda",
    "🖕 Te quiero",
    "🌼 Flores amarillas",
    "🤣 Prima loca",
    "💛 Siempre tú",
    "🌻 Sofía la fea ",
    "🖕🖕 Con cariño",
    "😂 No te emociones",
    "🌼 Mi prima la gorda ",
    "💛 Eres única",
    "🌻 Para Sofía",
    "🤣 Puro cariño",
    "🖕🖕🖕🖕",
    "🌻 Esta galaxia es tuya",
    "💛 Familia",
    "😂 Qué paciencia contigo",
    "🌼 Siempre haciendo desmadre",
    "🌻 Prima por siempre"
];


/* textura de texto */

function textTexture(text,color){

    const c=
        document.createElement("canvas");

    c.width=512;
    c.height=128;

    const ctx=
        c.getContext("2d");

    ctx.clearRect(
        0,0,512,128
    );

    ctx.font=
        "bold 48px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillStyle="#fff";

    ctx.shadowColor=color;
    ctx.shadowBlur=30;

    ctx.fillText(
        text,
        256,
        64
    );

    return new THREE.CanvasTexture(c);
}


const colors=[
    "#ffd900",
    "#fff176",
    "#ffad00",
    "#ffe45e",
    "#ffffff",
    "#ffca28"
];

const textGroup=
    new THREE.Group();

scene.add(textGroup);


for(let i=0;i<WORDS.length;i++){

    const material=
        new THREE.SpriteMaterial({

            map:textTexture(
                WORDS[i],
                colors[i%colors.length]
            ),

            transparent:true
        });

    const sprite=
        new THREE.Sprite(
            material
        );

    sprite.scale.set(
        55,
        14,
        1
    );

    const phi=
        Math.acos(
            2*Math.random()-1
        );

    const theta=
        Math.random()*Math.PI*2;

    const radius=
        160+
        Math.random()*170;

    sprite.position.set(

        radius*
        Math.sin(phi)*
        Math.cos(theta),

        radius*
        Math.cos(phi),

        radius*
        Math.sin(phi)*
        Math.sin(theta)

    );

    sprite.userData={
        phi,
        theta,
        radius,
        speed:
            .0005+
            Math.random()*.001
    };

    textGroup.add(sprite);
}


/* =====================================================
   CONTROLES
===================================================== */

let dragging=false;

let lastX=0;
let lastY=0;

let rotX=.2;
let rotY=0;

let targetDist=420;
let currentDist=420;

function down(e){

    dragging=true;

    const p=
        e.touches?
        e.touches[0]:
        e;

    lastX=p.clientX;
    lastY=p.clientY;
}

function move(e){

    if(!dragging)return;

    const p=
        e.touches?
        e.touches[0]:
        e;

    const dx=
        (p.clientX-lastX)/
        innerWidth;

    const dy=
        (p.clientY-lastY)/
        innerHeight;

    rotY-=dx*3;

    rotX=
        Math.max(
            -1.2,
            Math.min(
                1.2,
                rotX-dy*2
            )
        );

    lastX=p.clientX;
    lastY=p.clientY;
}

function up(){
    dragging=false;
}

addEventListener(
    "mousedown",
    down
);

addEventListener(
    "mousemove",
    move
);

addEventListener(
    "mouseup",
    up
);

addEventListener(
    "touchstart",
    down,
    {passive:true}
);

addEventListener(
    "touchmove",
    move,
    {passive:true}
);

addEventListener(
    "touchend",
    up,
    {passive:true}
);


/* zoom */

addEventListener(
    "wheel",
    e=>{

        targetDist+=
            e.deltaY*.3;

        targetDist=
            Math.max(
                150,
                Math.min(
                    1000,
                    targetDist
                )
            );
    },
    {passive:true}
);


/* =====================================================
   ANIMACIÓN
===================================================== */

let t=0;

function tick(){

    requestAnimationFrame(
        tick
    );

    t+=.01;

    galaxy.rotation.y+=.0007;

    ring1.rotation.z+=.003;
    ring2.rotation.z-=.002;
    ring3.rotation.z+=.001;

    const scale=
        1+
        Math.sin(t*2)*.06;

    core.scale.set(
        scale,
        scale,
        scale
    );

    sunflower.rotation.z=
        Math.sin(t*.7)*.08;

    textGroup.children.forEach(
        sprite=>{

            sprite.material.opacity=
                .8+
                .2*
                Math.sin(t*2);

            sprite.userData.theta+=
                sprite.userData.speed;

            const p=
                sprite.userData.phi;

            const a=
                sprite.userData.theta;

            const r=
                sprite.userData.radius;

            sprite.position.x=
                r*Math.sin(p)*Math.cos(a);

            sprite.position.z=
                r*Math.sin(p)*Math.sin(a);
        }
    );

    currentDist+=
        .06*
        (targetDist-currentDist);

    const cosX=
        Math.cos(rotX);

    const sinX=
        Math.sin(rotX);

    const cosY=
        Math.cos(rotY);

    const sinY=
        Math.sin(rotY);

    camera.position.set(

        currentDist*
        sinY*
        cosX,

        currentDist*
        sinX,

        currentDist*
        cosY*
        cosX
    );

    camera.lookAt(
        0,0,0
    );

    renderer.render(
        scene,
        camera
    );
}

tick();


/* =====================================================
   PÉTALOS
===================================================== */

function petals(){

    for(let i=0;i<25;i++){

        setTimeout(()=>{

            const p=
                document.createElement(
                    "div"
                );

            p.className="petal";

            p.textContent=
                Math.random()>.3
                ?"🌻"
                :"🌼";

            p.style.left=
                Math.random()*100+
                "vw";

            p.style.setProperty(
                "--drift",
                (
                    Math.random()*200-100
                )+"px"
            );

            p.style.animationDuration=
                (
                    3+
                    Math.random()*4
                )+"s";

            document.body.appendChild(p);

            setTimeout(
                ()=>p.remove(),
                8000
            );

        },i*60);
    }
}


/* =====================================================
   SORPRESA
===================================================== */

document
.getElementById("surprise")
.addEventListener(
    "click",
    ()=>{

        petals();

        setTimeout(
            ()=>{
                alert(
                    "🌻 Sofía, esta galaxia es para ti 😂🖕🖕🖕🖕"
                );
            },
            300
        );
    }
);


/* =====================================================
   REPRODUCTOR
===================================================== */

const audio=
    document.getElementById("audio");

const play=
    document.getElementById("play");

const progress=
    document.getElementById("progress");

const progressBar=
    document.getElementById("progressBar");

const time=
    document.getElementById("time");

let playing=false;

function formatTime(seconds){

    if(!isFinite(seconds))
        return "0:00";

    return (
        Math.floor(seconds/60)
        +":"
        +
        Math.floor(seconds%60)
        .toString()
        .padStart(2,"0")
    );
}

play.addEventListener(
    "click",
    async()=>{

        if(playing){

            audio.pause();

            play.textContent="▶️";

            playing=false;

        }else{

            try{

                await audio.play();

                play.textContent="⏸️";

                playing=true;

            }catch(e){

                alert(
                    "Coloca un archivo llamado musica.mp3 junto a este HTML."
                );
            }
        }
    }
);

audio.addEventListener(
    "timeupdate",
    ()=>{

        const percent=
            audio.currentTime/
            audio.duration*
            100;

        progressBar.style.width=
            (
                isFinite(percent)
                ?percent
                :0
            )+"%";

        time.textContent=
            formatTime(
                audio.currentTime
            )
            +" / "+
            formatTime(
                audio.duration
            );
    }
);

progress.addEventListener(
    "click",
    e=>{

        const rect=
            progress.getBoundingClientRect();

        const position=
            (
                e.clientX-
                rect.left
            )/
            rect.width;

        if(
            isFinite(
                audio.duration
            )
        ){

            audio.currentTime=
                position*
                audio.duration;
        }
    }
);

</script></body>
</html>
